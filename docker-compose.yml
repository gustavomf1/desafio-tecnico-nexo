services:
    postgres:
      image: postgres:16-alpine
      environment:
        POSTGRES_USER: nexo
        POSTGRES_PASSWORD: nexo
        POSTGRES_DB: nexo
      ports:
        - "5434:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
        - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U nexo"]
        interval: 3s
        retries: 10
        
volumes:
  pgdata: